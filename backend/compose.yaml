services:
  postgres:
    image: postgres:17
    container_name: lotofacil-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lotofacil
      POSTGRES_USER: lotofacil
      POSTGRES_PASSWORD: lotofacil_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
